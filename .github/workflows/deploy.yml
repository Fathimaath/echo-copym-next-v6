name: Deploy to cPanel via SFTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_EXPORT: 'true'
          NEXT_PUBLIC_API_URL: 'https://blog-api.copym.xyz'

      - name: Setup SSH key (strip passphrase)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa_encrypted
          chmod 600 ~/.ssh/id_rsa_encrypted
          if ssh-keygen -p -N "" -P "$PASSPHRASE" -f ~/.ssh/id_rsa_encrypted; then
            echo "Passphrase correct! Using decrypted key."
            cp ~/.ssh/id_rsa_encrypted ~/.ssh/id_rsa
          else
            echo "Passphrase WRONG. Trying key without passphrase."
            echo "$SSH_KEY" > ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 ${{ secrets.FTP_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync
        run: |
          rsync -avz --delete --timeout=300 -e "ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o BatchMode=yes" ./out/ ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:/home3/ndfhmyte/copym.xyz/copym-xyz/
        shell: bash
