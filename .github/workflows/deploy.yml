name: Deploy to cPanel via SFTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_EXPORT: 'true'
          NEXT_PUBLIC_API_URL: 'https://blog-api.copym.xyz'

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 ${{ secrets.FTP_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection
        run: |
          sshpass -p "${{ secrets.SSH_PASSPHRASE }}" ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }} "ls -la /home3/ndfhmyte/copym.xyz/ || ls -la ~/copym.xyz/"
        shell: bash

      - name: Deploy via rsync
        run: |
          sshpass -p "${{ secrets.SSH_PASSPHRASE }}" rsync -avz --delete --timeout=300 -e "ssh -p 22 -o StrictHostKeyChecking=no -o ConnectTimeout=30" ./out/ ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:/home3/ndfhmyte/copym.xyz/copym-xyz/
        shell: bash
